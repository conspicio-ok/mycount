services:

  back:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      DB_PATH: /data/mycount.db
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      # Dev en HTTP : un cookie Secure ne serait pas renvoyé. À retirer derrière HTTPS.
      AUTH_COOKIE_SECURE: "false"
    secrets:
      - JWT_SECRET
    volumes:
      - ./api:/app
      - ./data:/data
    networks:
      - mycount_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10m
      start_interval: 2s

  front:
    build:
      context: ./front
    restart: unless-stopped
    environment:
      API_URL: http://back:8080
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "5173:8080"
    depends_on:
      back:
        condition: service_healthy
    networks:
      - mycount_net

secrets:
  JWT_SECRET:
    file: ./.secrets/JWT_SECRET

networks:
  mycount_net:

